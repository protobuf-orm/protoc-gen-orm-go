edition = "2023";

package apptest;

import "apptest/tenant.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/protobuf-orm/protoc-gen-orm-go/internal/apptest";

message User {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
  }];
  Tenant tenant = 2 [(orm.edge) = {}];
  string alias = 4 [(orm.field) = {default: ""}];
  string name = 5 [(orm.field) = {default: ""}];
  map<string, string> labels = 7;

  // A `bytes` column, so that an index below can hold one. Every index in this
  // app was strings until now, which is why two generators could emit code that
  // does not compile for one and nobody noticed.
  bytes realm = 8 [(orm.field) = {type: TYPE_UUID}];

  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "alias"
        refs: [
          {
            name: "alias"
            number: 4
          },
          {
            name: "tenant"
            number: 2
          }
        ]
        unique: true
      },
      // An index holding a `bytes` column. It is here to be generated, not to
      // mean anything: `Picks` compared two of these with `==`, which does not
      // compile, and `GetByRealm` took a `uuid.UUID` while the constructor it
      // called took a `[]byte`.
      {
        name: "realm"
        refs: [
          {
            name: "realm"
            number: 8
          },
          {
            name: "alias"
            number: 4
          }
        ]
        unique: true
      }
    ]
  };
}
